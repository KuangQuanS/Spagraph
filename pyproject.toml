[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spagraph"
dynamic = ["version"]
description = "Spagraph: VAE + GAT spatial transcriptomics deconvolution and cell communication"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Spagraph contributors"}
]
keywords = ["spatial transcriptomics", "deconvolution", "single-cell", "deep learning", "GAT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/KuangQuanS/Spagraph"
Documentation = "https://github.com/KuangQuanS/Spagraph#readme"
Repository = "https://github.com/KuangQuanS/Spagraph.git"
"Bug Tracker" = "https://github.com/KuangQuanS/Spagraph/issues"

[tool.setuptools]
packages = [
    "spagraph",
    "spagraph.training",
    "spagraph.models",
    "spagraph.preprocessing",
    "spagraph.utils",
    "spagraph.cellcom",
    "spagraph.analysis",
]

[tool.setuptools.package-data]
"spagraph.cellcom" = ["cellchat_human.csv"]

[tool.setuptools.dynamic]
version = {attr = "spagraph.__version__.__version__"}

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
